name: HydraTact Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Backend API & Spatial Core (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend-api/requirements.txt
          pip install httpx

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s apps/backend-api/tests

      - name: Run Spatial Core Python Tests
        run: |
          python -m unittest packages/spatial-core/python/tests/test_spatial_core.py

      - name: Run E2E Scenario Test (Jl. Pelita Gg. 4)
        run: |
          python tests/e2e/test_pelita_gg4_scenario.py

  test-node:
    name: Web Command, Citizen PWA & Spatial Core (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Spatial Core Tests
        run: |
          node --experimental-strip-types --test packages/spatial-core/test/*.test.ts

      - name: Run Citizen PWA Tests
        run: |
          node --experimental-strip-types --test apps/pwa-citizen/src/**/__tests__/*.test.ts

      - name: Run Web Command Tests
        run: |
          node --experimental-strip-types --test apps/web-command/src/**/__tests__/*.test.ts
